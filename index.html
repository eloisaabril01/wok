<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K='wokbite_v1',CATS=['Rolls','Soups','Starters','Combos','Momos','Noodles','Rice'];
const M=[['Rolls','Veg Roll',null,100],['Rolls','Paneer Roll',null,120],['Soups','Manchow Soup',null,100],['Soups','Hot & Sour Soup',null,100],['Soups','Noodles Soup (Thukpa)',null,120],
['Starters','Manchurian Veg (Dry)',90,140],['Starters','Manchurian Veg (Gravy)',100,160],['Starters','Paneer Chilli (Dry)',100,160],['Starters','Paneer Chilli (Gravy)',100,160],['Starters','Chilli Potato',null,120],
['Combos','Fried Rice + Manchurian + Cold Drink',null,350],['Combos','Fried Rice + Paneer Chilli + Cold Drink',null,350],['Combos','Fried Rice + Potato Chilli + Cold Drink',null,320],
['Momos','Steam Momo (Veg)',null,120],['Momos','Steam Momo (Paneer)',null,140],['Momos','Fried Momo (Veg)',null,140],['Momos','Fried Momo (Paneer)',null,150],['Momos','Kurkure Momo (Veg)',null,140],['Momos','Kurkure Momo (Paneer)',null,150],['Momos','Tandoori Momo (Veg)',null,140],['Momos','Tandoori Momo (Paneer)',null,150],['Momos','Rose Momo',null,150],['Momos','Chilli Momo',null,150],
['Noodles','Veg Hakka Noodles',100,140],['Noodles','Veg Manchurian Dry Noodles',100,160],['Noodles','Burnt Chilli Garlic Noodles',100,140],['Noodles','Schezwan Noodles',100,150],
['Rice','Veg Fried Rice',100,150],['Rice','Veg Manchurian Dry Rice',100,170],['Rice','Burnt Chilli Garlic Rice',100,160],['Rice','Schezwan Fried Rice',100,150]];
function seed(){return{menu:M.map((m,i)=>({id:i+1,c:m[0],n:m[1],h:m[2],f:m[3]})),orders:[],seq:1,nid:100,set:{name:'Wok & Bite',tag:'Good Food • Great Mood',addr:'',gst:0,pin:''}}}
let D=seed(),db=null,note='Connecting…';
const save=()=>{if(!db||!admin)return;db.doc('menu/main').set({menu:D.menu,set:D.set,nid:D.nid}).catch(e=>alert('Save failed: '+(e.message||e.code)))};
function idle(){if(tab=='adm'&&$('#qrs')&&$('#qrs').children.length)return;const a=document.activeElement;if(!a||!/INPUT|TEXTAREA|SELECT/.test(a.tagName))render(1)}
let tab='bill',cat='Rolls',q='',cart=[],disc=0,pay='Cash',admin=false,od=new Date().toLocaleDateString('en-CA'),rd='0';
const fmt=n=>'₹'+(+n).toLocaleString('en-IN',{maximumFractionDigits:2});
const price=(i,s)=>s==='h'?i.h:i.f;
const item=id=>D.menu.find(x=>x.id==id);
const label=(i,s)=>i.n+(i.h!=null?(s==='h'?' (Half)':' (Full)'):'');

let QR=[],QK='',snd=false,ac,first=true,known=new Set();
const EM=i=>{const n=i.n.toLowerCase();return n.includes('momo')?'🥟':n.includes('roll')?'🌯':n.includes('soup')?'🍲':i.c=='Combos'?'🍱':n.includes('potato')?'🍟':n.includes('noodle')?'🍜':n.includes('rice')?'🍚':n.includes('paneer')?'🧀':'🥘'};
const GR={Rolls:'#f59e0b,#ef4444',Soups:'#f97316,#dc2626',Starters:'#ef4444,#9f1239',Combos:'#8b5cf6,#db2777',Momos:'#fb923c,#e11d48',Noodles:'#f59e0b,#b45309',Rice:'#fbbf24,#ea580c'};
const pic=(i,h)=>i.img?`<div class="pic" style="height:${h}px;background-image:url('${String(i.img).replace(/['"()\s]/g,'')}')"></div>`:`<div class="pic art" style="height:${h}px;background:linear-gradient(135deg,${GR[i.c]||'#f59e0b,#ef4444'})"><span>${EM(i)}</span></div>`;
function ring(){if(!snd)return;try{[0,.25,.5].forEach(d=>{const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=880+d*400;g.gain.setValueAtTime(.25,ac.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d+.2);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+d);o.stop(ac.currentTime+d+.22)});navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function enSnd(){ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();snd=true;ring();$('#snd').textContent='🔔 Sound on'}
setInterval(()=>{if(QR.some(o=>o.status=='new'))ring()},6000);
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<1?'just now':m+' min ago'};
function qprice(o){let sub=0;const L=o.items.map(x=>{const i=item(x.id),p=i?price(i,x.s):0;sub+=p*x.q;return{n:x.n,p,q:x.q}});return{L,sub}}
function vOn(){const L=QR.filter(o=>o.status!='done'&&o.status!='cancelled').reverse().sort((a,b)=>(a.status=='new'?0:1)-(b.status=='new'?0:1));
return(L.length?'':'<p class="mut">No active online orders. Customers scan the table QR to order.</p>')+L.map(o=>{const q=qprice(o),st=o.status;return`<div class="card ${st=='new'?'newo':''}"><div class="row" style="border:0"><b>${o.table?'Table '+o.table:'Takeaway'}${o.name?' · '+esc(o.name):''} · #${o.id.slice(-4).toUpperCase()}</b><b>${fmt(q.sub)}</b></div><div class="mut">${ago(o.t)} · ${q.L.map(i=>esc(i.n)+' ×'+i.q).join(', ')}</div><div class="f">${st=='new'?`<button class="sm ok" onclick="qs('${o.id}','accepted')">✓ Accept</button><button class="sm d" onclick="qs('${o.id}','cancelled')">✕ Reject</button>`:st=='accepted'?`<button class="sm ok" onclick="qs('${o.id}','ready')">Mark Ready</button>`:['Cash','UPI','Card'].map(p=>`<button class="sm ok" onclick="qdone('${o.id}','${p}')">Paid ${p}</button>`).join('')}</div></div>`}).join('')}
function qs(id,st){db.doc('qr/'+id).update({status:st}).catch(e=>alert(e.message))}
function qdone(id,p){const o=QR.find(x=>x.id==id),q=qprice(o),g=Math.round(q.sub*D.set.gst/100),dk=new Date().toLocaleDateString('en-CA'),no=1+Math.max(0,...D.orders.filter(x=>new Date(x.t).toLocaleDateString('en-CA')==dk).map(x=>x.no));
const b={no,id:'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),t:Date.now(),cust:(o.table?'T'+o.table:'Takeaway')+(o.name?' '+o.name:''),pay:p,disc:0,items:q.L,sub:q.sub,d:0,g,total:q.sub+g};
D.orders.push(b);db.doc('orders/'+b.id).set(b).then(()=>{qs(id,'done');prt(b.id)}).catch(e=>alert(e.message))}
function vQR(){return`<div class="card"><h3 style="margin-top:0">Customer QR ordering</h3><p class="mut">1) Type a secret word and save it. Only QR codes made with it can place orders (change it any time to cancel old QR codes). 2) Create the QR codes and print them for your tables.</p><div class="f"><input id="qk" placeholder="Secret word e.g. wok7391" value="${esc(QK)}"><button class="sm" onclick="setKey()">Save secret</button></div><div class="f"><input id="qn" type="number" min="1" max="60" value="10" style="width:80px"> tables <button class="sm" onclick="mkQR()">Create QR codes</button><button class="sm" onclick="printQR()">Print</button></div><div id="qrs" class="qrs"></div></div>`}
function setKey(){const k=$('#qk').value.trim();if(k.length<4)return alert('Use at least 4 characters');db.doc('secret/main').set({key:k}).then(()=>{QK=k;alert('Secret saved')}).catch(e=>alert(e.message))}
function mkQR(){const k=$('#qk').value.trim(),n=+$('#qn').value||10;if(!k)return alert('Save a secret word first');const box=$('#qrs');box.innerHTML='';for(let t=0;t<=n;t++){const d=document.createElement('div');d.className='qc';d.innerHTML='<b>'+(t?'Table '+t:'Takeaway')+'</b><br>';const u=new URL('order.html',location.href);u.search='?table='+t+'&k='+encodeURIComponent(k);new QRCode(d,{text:u.href,width:150,height:150});d.insertAdjacentHTML('beforeend','<div>Scan to order</div>');box.append(d)}}
function printQR(){const p=$('#print');p.style.width='190mm';p.innerHTML='<div class="qp">'+$('#qrs').innerHTML+'</div>';window.print();setTimeout(()=>{p.style.width=''},800)}
function tot(){let sub=0;cart.forEach(c=>{const i=item(c.id);if(i)sub+=price(i,c.s)*c.q});const d=Math.round(sub*disc/100),g=Math.round((sub-d)*D.set.gst/100);return{sub,d,g,t:sub-d+g}}
function add(id,s){const c=cart.find(x=>x.id==id&&x.s==s);c?c.q++:cart.push({id,s,q:1});cartR()}
function chg(k,n){cart[k].q+=n;if(cart[k].q<1)cart.splice(k,1);cartR()}

function nav(){$('#nav').innerHTML=[['bill','Billing'],['on','Online'+(QR.filter(o=>o.status=='new').length?` <b class="bdg">${QR.filter(o=>o.status=='new').length}</b>`:'')],['ord','Orders'],['adm','Admin']].map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('')+'<button onclick="auth.signOut()">Logout</button>'}
function render(keep){nav();$('#main').innerHTML=tab=='bill'?vBill():tab=='on'?vOn():tab=='ord'?vOrd():vAdm();if(tab=='bill'){gridR();cartR()}if(!keep)window.scrollTo(0,0)}

function vBill(){return`<div class="split"><section><input id="s" style="width:100%" placeholder="Search item…" value="${esc(q)}" oninput="q=this.value;gridR()"><div class="chips" id="chips"></div><div class="grid" id="grid"></div></section><aside id="cart" class="card"></aside></div>`}
function gridR(){
$('#chips').innerHTML=CATS.map(c=>`<button class="${cat==c&&!q?'on':''}" onclick="cat='${c}';q='';$('#s').value='';gridR()">${c}</button>`).join('');

$('#grid').innerHTML=L.map(i=>`<div class="it">${pic(i,72)}<b>${esc(i.n)}</b><div>${i.h!=null?`<button class="pb h" onclick="add(${i.id},'h')">Half ${i.h}</button>`:''}<button class="pb" onclick="add(${i.id},'f')">${i.h!=null?'Full ':''}${i.f}</button></div></div>`).join('')||'<p class="mut">No items</p>'}
function cartR(){if(tab!='bill')return;const T=tot(),n=cart.reduce((a,c)=>a+c.q,0),cv=($('#cu')||{}).value||'';
$('#cart').innerHTML=`<h3 style="margin:0 0 6px">Current bill</h3>${cart.map((c,k)=>{const i=item(c.id);return i?`<div class="row"><span style="flex:1">${esc(label(i,c.s))}<br><span class="mut">${fmt(price(i,c.s))}</span></span><span class="q"><button onclick="chg(${k},-1)">−</button> ${c.q} <button onclick="chg(${k},1)">+</button></span><b>${fmt(price(i,c.s)*c.q)}</b></div>`:''}).join('')||'<p class="mut">Tap items to add</p>'}
<div class="f"><input id="cu" placeholder="Customer / Table" style="flex:1"><input type="number" min="0" max="100" value="${disc}" style="width:80px" onchange="disc=Math.min(100,Math.max(0,+this.value||0));cartR()" title="Discount %"><span class="mut">% off</span></div>
<div class="f">${['Cash','UPI','Card'].map(p=>`<label><input type="radio" name="pm" ${pay==p?'checked':''} onchange="pay='${p}'"> ${p}</label>`).join(' ')}</div>
<div class="tr"><span>Subtotal</span><span>${fmt(T.sub)}</span></div>${T.d?`<div class="tr"><span>Discount</span><span>−${fmt(T.d)}</span></div>`:''}${T.g?`<div class="tr"><span>GST ${D.set.gst}%</span><span>${fmt(T.g)}</span></div>`:''}
<div class="tr big"><span>Total</span><span>${fmt(T.t)}</span></div>
<button class="go" onclick="place()">Save &amp; Print Bill</button><button class="sm" style="width:100%;margin-top:8px" onclick="if(confirm('Clear this bill?')){cart=[];disc=0;cartR()}">Clear</button>`;
$('#cu').value=cv;$('#cart .big span:last-child').classList.add('pulse');const f=$('#fab');f.hidden=!n;f.textContent=`View bill · ${n} items · ${fmt(T.t)}`}
function place(){if(!cart.length)return alert('Add items first');const T=tot();
const dk=new Date().toLocaleDateString('en-CA'),no=1+Math.max(0,...D.orders.filter(x=>new Date(x.t).toLocaleDateString('en-CA')==dk).map(x=>x.no));
const o={no,id:'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),t:Date.now(),cust:$('#cu').value.trim(),pay,disc,items:cart.filter(c=>item(c.id)).map(c=>{const i=item(c.id);return{n:label(i,c.s),p:price(i,c.s),q:c.q}}),sub:T.sub,d:T.d,g:T.g,total:T.t};
if(!db)return alert('Not connected yet. Check your internet and sign-in.');D.orders.push(o);db.doc('orders/'+o.id).set(o).then(()=>{cart=[];disc=0;cartR();toast('✓ Bill #'+o.no+' saved');prt(o.id)}).catch(e=>alert('Could not save bill: '+(e.message||e.code)))}
function prt(id){const o=D.orders.find(x=>x.id==id),S=D.set;if(!o)return;
$('#print').innerHTML=`<div style="text-align:center"><b style="font-size:16px">${esc(S.name)}</b><br>${esc(S.tag)}<br>${esc(S.addr)}</div><hr>Bill #${o.no}<br>${new Date(o.t).toLocaleString('en-IN')}<br>${o.cust?'For: '+esc(o.cust)+'<br>':''}<hr>${o.items.map(i=>`<div class="pl"><span>${esc(i.n)} x${i.q}</span><span>${i.p*i.q}</span></div>`).join('')}<hr><div class="pl"><span>Subtotal</span><span>${o.sub}</span></div>${o.d?`<div class="pl"><span>Discount</span><span>-${o.d}</span></div>`:''}${o.g?`<div class="pl"><span>GST</span><span>${o.g}</span></div>`:''}<div class="pl"><b>TOTAL</b><b>${o.total}</b></div><div>Paid by: ${o.pay}</div><hr><div style="text-align:center">Thank you! Visit again</div>`;
setTimeout(()=>window.print(),50)}

function vOrd(){const L=D.orders.filter(o=>new Date(o.t).toLocaleDateString('en-CA')==od).reverse(),sum=L.reduce((a,o)=>a+o.total,0);
return`<div class="f"><input type="date" value="${od}" onchange="od=this.value;render()"><b>${L.length} bills · ${fmt(sum)}</b></div>${L.map(o=>`<div class="card"><div class="row" style="border:0"><b>#${o.no} · ${new Date(o.t).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}${o.cust?' · '+esc(o.cust):''}</b><b>${fmt(o.total)}</b></div><div class="mut">${o.items.map(i=>esc(i.n)+' ×'+i.q).join(', ')} · ${o.pay}</div><div class="f"><button class="sm" onclick="prt('${o.id}')">Reprint</button>${admin?`<button class="sm d" onclick="delOrd('${o.id}')">Delete</button>`:''}</div></div>`).join('')||'<p class="mut">No bills on this date.</p>'}`}
function delOrd(id){if(confirm('Delete this bill?'))db.doc('orders/'+id).delete()}

function vAdm(){
if(!admin)return`<div class="card"><h3 style="margin-top:0">Admin only</h3><p class="mut">${db?'Only the owner or invited Editors can open this. Staff can bill from the Billing tab.':note}</p></div>`;
const st=rd=='all'?0:new Date().setHours(0,0,0,0)-(+rd)*864e5,L=D.orders.filter(o=>o.t>=st),sum=L.reduce((a,o)=>a+o.total,0),bp={},bi={};
L.forEach(o=>{bp[o.pay]=(bp[o.pay]||0)+o.total;o.items.forEach(i=>{bi[i.n]=(bi[i.n]||0)+i.q})});
const top=Object.entries(bi).sort((a,b)=>b[1]-a[1]).slice(0,10);
return`<div class="card"><h3 style="margin-top:0">Sales report</h3><div class="f"><select onchange="rd=this.value;render()">${[['0','Today'],['7','Last 7 days'],['30','Last 30 days']].map(([v,l])=>`<option value="${v}" ${rd==v?'selected':''}>${l}</option>`).join('')}</select></div>
<div class="big">${fmt(sum)}</div><div class="mut">${L.length} bills${L.length?' · avg '+fmt(sum/L.length):''}</div>
<p>${Object.entries(bp).map(([k,v])=>`${k}: <b>${fmt(v)}</b>`).join(' · ')||'—'}</p><b>Top items</b>${top.map(([n,c])=>`<div class="tr"><span>${esc(n)}</span><span>${c}</span></div>`).join('')||'<p class="mut">No sales yet</p>'}</div>
<div class="card"><h3 style="margin-top:0">Menu</h3><div class="f"><input id="nn" placeholder="New item name" style="flex:1;min-width:140px"><select id="nc">${CATS.map(c=>`<option>${c}</option>`).join('')}</select><input id="nh" type="number" placeholder="Half" style="width:75px"><input id="nf" type="number" placeholder="Full" style="width:75px"><button class="sm" onclick="addItem()">Add</button></div>
<div class="sc"><table><tr><th>Name</th><th>Category</th><th>Half</th><th>Full/Price</th><th>Photo link</th><th>On</th><th></th></tr>${D.menu.map(i=>`<tr><td><input value="${esc(i.n)}" onchange="ed(${i.id},'n',this.value)"></td><td><select onchange="ed(${i.id},'c',this.value)">${CATS.map(c=>`<option ${c==i.c?'selected':''}>${c}</option>`).join('')}</select></td><td><input type="number" style="width:70px" value="${i.h??''}" onchange="ed(${i.id},'h',this.value)"></td><td><input type="number" style="width:70px" value="${i.f}" onchange="ed(${i.id},'f',this.value)"></td><td><input value="${esc(i.img||'')}" placeholder="img/name.jpg or link" onchange="ed(${i.id},'img',this.value.trim())"></td><td><input type="checkbox" ${i.a===false?'':'checked'} onchange="ed(${i.id},'a',this.checked)"></td><td><button class="sm d" onclick="delItem(${i.id})">✕</button></td></tr>`).join('')}</table></div></div>
<div class="card"><h3 style="margin-top:0">Settings</h3><div class="f"><input value="${esc(D.set.name)}" onchange="D.set.name=this.value;save()" placeholder="Name"><input value="${esc(D.set.tag)}" onchange="D.set.tag=this.value;save()" placeholder="Tagline"></div><div class="f"><input value="${esc(D.set.addr)}" onchange="D.set.addr=this.value;save()" placeholder="Address / phone on bill" style="flex:1"><label>GST % <input type="number" min="0" value="${D.set.gst}" style="width:70px" onchange="D.set.gst=+this.value||0;save()"></label></div></div>
${vQR()}<div class="card"><h3 style="margin-top:0">Backup &amp; restore</h3><p class="mut">Live data is stored in your Firebase database (last 30 days of bills load here). Download a backup file every week and keep it in Google Drive. Restore brings back the menu and settings only.</p><textarea id="bk" rows="4" style="width:100%" onfocus="this.select()">${esc(JSON.stringify(D))}</textarea><div class="f"><button class="sm" onclick="restore()">Restore from text</button><button class="sm" onclick="dl('json')">Download backup file</button><button class="sm" onclick="dl('csv')">Download sales (CSV)</button><button class="sm d" onclick="wipe()">Erase all bills</button></div></div>`}
function ed(id,k,v){const i=item(id);i[k]=(k=='h')?(v===''?null:+v):k=='f'?(+v||0):v;save()}
function addItem(){const n=$('#nn').value.trim(),f=+$('#nf').value;if(!n||!f)return alert('Enter name and full price');const h=$('#nh').value;D.menu.push({id:D.nid++,c:$('#nc').value,n,h:h===''?null:+h,f});save();render()}
function delItem(id){if(confirm('Delete this item?')){D.menu=D.menu.filter(i=>i.id!=id);save();render()}}
function restore(){try{const d=JSON.parse($('#bk').value);if(!d.menu||!d.orders)throw 0;if(!confirm('Replace menu and settings with this backup?'))return;D.menu=d.menu;D.set=d.set||D.set;save();render()}catch(e){alert('Invalid backup text')}}
function wipe(){if(confirm('Erase ALL bills? This cannot be undone.')&&confirm('Really erase?')){D.orders.forEach(o=>db.doc('orders/'+o.id).delete())}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1900)}
$('#bg').innerHTML=['🍜','🥟','🍚','🌶️','🥢','🔥','🍜','🥟','🍚'].map((e,i)=>`<i style="left:${(i*13+4)%92}%;top:${(i*29+6)%85}%;animation-delay:${-i*1.3}s;font-size:${32+i%3*14}px">${e}</i>`).join('');
const tl=(e,x,y)=>{const c=e.target.closest&&e.target.closest('.it');if(c){const r=c.getBoundingClientRect();c.style.setProperty('--ry',x?((e.clientX-r.left)/r.width-.5)*14+'deg':'0deg');c.style.setProperty('--rx',x?(.5-(e.clientY-r.top)/r.height)*14+'deg':'0deg')}};
document.addEventListener('pointermove',e=>tl(e,1));document.addEventListener('pointerout',e=>tl(e,0));
function dl(k){let t,n;const d=new Date().toLocaleDateString('en-CA');
if(k=='json'){t=JSON.stringify(D);n='wokbite-backup-'+d+'.json'}else{t='Bill,Date,Time,Customer,Payment,Items,Subtotal,Discount,GST,Total\n'+D.orders.map(o=>{const x=new Date(o.t);return[o.no,x.toLocaleDateString('en-CA'),x.toLocaleTimeString('en-IN'),o.cust,o.pay,o.items.map(i=>i.n+' x'+i.q).join('; '),o.sub,o.d,o.g,o.total].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')}).join('\n');n='wokbite-sales-'+d+'.csv'}
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download=n;a.click()}
function vLogin(){return`<div class="card login3d" style="max-width:340px;margin:30px auto"><div class="logo" style="font-size:60px;text-align:center">🍜</div><h3 style="margin:0 0 10px;text-align:center">Wok &amp; Bite</h3><input id="em" type="email" placeholder="Email" style="width:100%;margin-bottom:8px"><input id="pw" type="password" placeholder="Password" style="width:100%" onkeydown="if(event.key=='Enter')doLogin()"><button class="go" onclick="doLogin()">Login</button><p id="err" style="color:var(--bad)"></p></div>`}
function doLogin(){auth.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value).catch(e=>{$('#err').textContent=({'auth/invalid-credential':'Wrong email or password','auth/wrong-password':'Wrong email or password','auth/user-not-found':'This email is not added in Firebase > Authentication > Users','auth/unauthorized-domain':'Add this website address in Firebase > Authentication > Settings > Authorized domains','auth/operation-not-allowed':'Turn on Email/Password in Firebase > Authentication > Sign-in method','auth/network-request-failed':'No internet'}[e.code])||('Error: '+e.code)})}
const hdr=()=>{$('#st').textContent=navigator.onLine?'● online':'● offline: bills will sync later'};
addEventListener('online',hdr);addEventListener('offline',hdr);hdr();
let auth,fs,unsubs=[];
function start(){unsubs.forEach(f=>f());unsubs=[];
unsubs.push(fs.doc('menu/main').onSnapshot(s=>{if(s.exists){const v=s.data();D.menu=v.menu||D.menu;D.set=Object.assign(D.set,v.set);D.nid=v.nid||D.nid}if(tab=='bill'){gridR();cartR()}else idle()},e=>{note='Sync error: '+e.code}));
const since=Date.now()-30*864e5;
unsubs.push(fs.collection('orders').where('t','>=',since).orderBy('t','desc').onSnapshot(s=>{D.orders=s.docs.map(d=>d.data()).reverse();if(tab!='bill')idle()},e=>{note='Sync error: '+e.code}));
first=true;known=new Set();
unsubs.push(fs.collection('qr').where('t','>=',Date.now()-864e5).orderBy('t','desc').onSnapshot(s=>{QR=s.docs.map(d=>Object.assign({},d.data(),{id:d.id}));const nw=QR.filter(o=>o.status=='new');if(!first&&nw.some(o=>!known.has(o.id)))ring();nw.forEach(o=>known.add(o.id));first=false;nav();if(tab=='on')idle()},e=>{note='Sync error: '+e.code}));
if(admin)fs.doc('secret/main').get().then(x=>{QK=x.exists?x.data().key:''}).catch(()=>{})}
try{firebase.initializeApp(FB);auth=firebase.auth();fs=firebase.firestore();fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
auth.onAuthStateChanged(u=>{if(!u){unsubs.forEach(f=>f());unsubs=[];db=null;admin=false;$('#nav').innerHTML='';$('#main').innerHTML=vLogin();return}
admin=ADMINS.includes((u.email||'').toLowerCase());db=fs;note='';start();render()})}
catch(e){$('#main').innerHTML='<p style="padding:20px">Paste your Firebase keys at the top of the script first.</p>'}
</script></body></html>
