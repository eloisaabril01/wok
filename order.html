<style>

.steps .on{color:var(--tx)}.steps .on i{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 8px 16px -6px var(--ac2)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header class="hero">
  <div class="top"><div class="brand"><div class="lg">🍜</div><div>Wok <span>&amp;</span> Bite</div></div><span class="pill" id="tb"></span></div>
  <h1>Craving something <em>delicious?</em></h1><p>Order from your seat. Fresh, hot &amp; made to order.</p>
  <button class="pill" id="tk" hidden style="margin-top:18px;position:relative;z-index:1" onclick="track(localStorage.lastq)">📦 Track my order</button>
</header>
<div class="bar"><label class="sb"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="s" placeholder="Search momos, noodles, rolls…" oninput="q=this.value;gridR(1)"></label><div class="tabs" id="ch"></div></div>
<div class="sec"><b id="st"></b><span id="cn"></span></div>
<main class="grid" id="g"><p class="msg">Loading… 🍜</p></main><noscript><p class="msg">Please enable JavaScript to order.</p></noscript>

<script>
window.addEventListener('error',e=>{const g=document.getElementById('g');if(g&&!g.children.length||/Loading/.test(g&&g.textContent))g.innerHTML='<p class="msg">Something went wrong: '+String(e.message).replace(/</g,'')+'<br>Please refresh or ask the staff.</p>'});
const FB={apiKey:"AIzaSyCFI9yG0NSycWu7ONq9ogyTL7G4Kdgk-6A",authDomain:"wokk-94f97.firebaseapp.com",projectId:"wokk-94f97",appId:"1:983115998097:web:cd1b67242223dc8a013030"};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=new URLSearchParams(location.search),TB=+P.get('table')||0,KEY=P.get('k')||'';
const CATS=['Rolls','Soups','Starters','Combos','Momos','Noodles','Rice'];
/* ---------- REAL PHOTOS ----------
 1) If the dish has an "img" link/path in the admin panel, that exact photo is used (best option).
 2) Otherwise a real food photo is fetched from Wikipedia by dish type and cached on the phone. */
const WK=[[/spring\s*roll/,['Spring_roll']],[/momo|dumpling|dimsum|dim sum/,['Momo_(food)','Dumpling']],[/roll|wrap|kathi/,['Kati_roll','Wrap_(food)']],
[/manchow|hot.*sour/,['Hot_and_sour_soup']],[/corn.*soup/,['Corn_soup','Hot_and_sour_soup']],[/tomato.*soup/,['Tomato_soup']],[/soup/,['Hot_and_sour_soup']],
[/hakka|noodle|chow|chowmein|chowmin/,['Hakka_noodles','Chow_mein']],[/fried rice|rice|biryani/,['Fried_rice']],[/manchurian/,['Manchurian_(dish)','Chilli_chicken']],
[/paneer/,['Paneer_tikka']],[/potato|fries|finger/,['French_fries']],[/chilli|chili/,['Chilli_chicken']],[/samosa/,['Samosa']],[/pasta/,['Pasta']],[/sandwich/,['Sandwich']],[/pizza/,['Pizza']],[/burger/,['Hamburger']]];
const CF={Rolls:['Kati_roll'],Soups:['Hot_and_sour_soup'],Starters:['Indian_Chinese_cuisine','Chilli_chicken'],Combos:['Thali'],Momos:['Momo_(food)'],Noodles:['Chow_mein'],Rice:['Fried_rice']};
const titles=i=>{const n=(i.n||'').toLowerCase(),h=WK.find(w=>w[0].test(n));return[...(h?h[1]:[]),...(CF[i.c]||[]),'Indian_Chinese_cuisine']};
const IC={},PEND={};
async function wiki(t){const k='wi2:'+t;try{const c=localStorage.getItem(k);if(c)return c==='-'?null:c}catch(e){}
if(PEND[t])return PEND[t];return PEND[t]=fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(t)).then(r=>r.ok?r.json():null).then(j=>{const u=j&&j.thumbnail&&j.thumbnail.source?j.thumbnail.source.replace(/\/\d+px-/,'/640px-'):null;try{localStorage.setItem(k,u||'-')}catch(e){}return u}).catch(()=>null)}
async function photo(i){if(i.img)return String(i.img).replace(/['"()\s]/g,'');if(IC[i.id])return IC[i.id];for(const t of titles(i)){const u=await wiki(t);if(u)return IC[i.id]=u}return null}
const io='IntersectionObserver'in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);loadImg(e.target)}}),{rootMargin:'200px'}):null;
function loadImg(el){const i=item(el.dataset.id);if(!i)return;photo(i).then(u=>{if(!u)return el.classList.add('fb');const im=new Image();im.alt=i.n;im.onload=()=>{IC[i.id]=u;el.prepend(im);requestAnimationFrame(()=>{im.classList.add('ok');el.classList.add('done')})};im.onerror=()=>el.classList.add('fb');im.src=u})}
let M=[],cart=[],cat='Rolls',q='',U=null,NM='',unsub=null,busy=false,SZ={},first=true;
const fmt=n=>'₹'+(+n).toLocaleString('en-IN');
const item=id=>M.find(x=>x.id==id),price=(i,s)=>s=='h'?i.h:i.f,label=(i,s)=>i.n+(i.h!=null?(s=='h'?' (Half)':' (Full)'):'');
const tot=()=>cart.reduce((a,c)=>{const i=item(c.id);return a+(i?price(i,c.s)*c.q:0)},0);
const qty=(id,s)=>{const c=cart.find(c=>c.id==id&&c.s==s);return c?c.q:0};
const msg=t=>{$('#g').innerHTML=`<p class="msg">${t}</p>`};
$('#tb').textContent=TB?'🪑 Table '+TB:'🥡 Takeaway';
if(localStorage.lastq)$('#tk').hidden=false;
function chipsR(){$('#ch').innerHTML=CATS.map(c=>`<button class="${cat==c&&!q?'on':''}" onclick="cat='${c}';q='';$('#s').value='';chipsR();gridR(1)">${c}</button>`).join('')}
const sz=i=>i.h==null?'f':(SZ[i.id]||'f');
function bot(i){const s=sz(i),n=qty(i.id,s);return`${i.h!=null?`<div class="sg"><button class="${s=='h'?'on':''}" onclick="setSz(${i.id},'h')">Half${qty(i.id,'h')?` <i>·${qty(i.id,'h')}</i>`:''}</button><button class="${s=='f'?'on':''}" onclick="setSz(${i.id},'f')">Full${qty(i.id,'f')?` <i>·${qty(i.id,'f')}</i>`:''}</button></div>`:''}<div class="row"><div class="pr">${fmt(price(i,s))}</div>${n?`<div class="st"><button onclick="chg2(${i.id},'${s}',-1)" aria-label="Remove one">−</button><b>${n}</b><button onclick="chg2(${i.id},'${s}',1)" aria-label="Add one">+</button></div>`:`<button class="add" onclick="chg2(${i.id},'${s}',1)" aria-label="Add">+</button>`}</div>`}
function card(i,k,a){return`<div class="c ${a?'a':''}" style="${a?`animation-delay:${Math.min(k,10)*40}ms`:''}"><div class="im" data-id="${i.id}" data-l="${esc((i.n||'?')[0])}"><span class="tg">${esc(i.c)}</span></div><div class="cb"><div class="nm">${esc(i.n)}</div><div id="b${i.id}" style="display:flex;flex-direction:column;gap:9px;margin-top:auto">${bot(i)}</div></div></div>`}
function gridR(a){const L=M.filter(i=>q?i.n.toLowerCase().includes(q.toLowerCase()):i.c==cat);
$('#st').textContent=q?'Results':cat;$('#cn').textContent=L.length+' dishes';
$('#g').innerHTML=L.map((i,k)=>card(i,k,a)).join('')||'<p class="msg">No dishes found</p>';
$('#g').querySelectorAll('.im').forEach(el=>{const i=item(el.dataset.id);if(i&&IC[i.id]){loadImg(el)}else io?io.observe(el):loadImg(el)})}
function setSz(id,s){SZ[id]=s;refreshCtl(id)}
function refreshCtl(id){const i=item(id),el=$('#b'+id);if(i&&el)el.innerHTML=bot(i)}
function bar(){const n=cart.reduce((a,c)=>a+c.q,0),b=$('#cb');b.hidden=!n;b.innerHTML=`<div class="l"><small>${n} item${n>1?'s':''} added</small><b>${fmt(tot())}</b></div><button class="go" onclick="sh(1)">View order →</button>`;b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');if($('#sheet').classList.contains('open'))sheetR()}
function chg2(id,s,n){const c=cart.find(x=>x.id==id&&x.s==s);if(c){c.q=Math.min(20,c.q+n);if(c.q<1)cart.splice(cart.indexOf(c),1)}else if(n>0)cart.push({id,s,q:1});refreshCtl(id);bar()}
function chg(k,n){const id=cart[k].id;cart[k].q=Math.min(20,cart[k].q+n);if(cart[k].q<1)cart.splice(k,1);refreshCtl(id);bar();if(!cart.length)sh(0)}
function sh(o){$('#sheet').classList.toggle('open',!!o);if(o)sheetR()}
function sheetR(){$('#si').innerHTML=`<div class="gr"></div><h3>Your order</h3><div class="m">${TB?'Table '+TB:'Takeaway'}</div>${cart.map((c,k)=>{const i=item(c.id);return i?`<div class="r">${IC[i.id]||i.img?`<img class="th" alt="" src="${esc(IC[i.id]||String(i.img).replace(/['"()\s]/g,''))}">`:'<div class="th"></div>'}<div style="flex:1;min-width:0"><b>${esc(label(i,c.s))}</b><div class="m">${fmt(price(i,c.s))} × ${c.q} = <b style="color:var(--tx)">${fmt(price(i,c.s)*c.q)}</b></div></div><div class="st"><button onclick="chg(${k},-1)">−</button><b>${c.q}</b><button onclick="chg(${k},1)">+</button></div></div>`:''}).join('')}<input class="in" id="nm" placeholder="Your name (optional)" maxlength="40" value="${esc(NM)}" oninput="NM=this.value"><div class="t"><span>Total</span><b>${fmt(tot())}</b></div><button class="pl" id="pl" onclick="place()">Place order</button><p class="m c2" style="margin-bottom:0">Pay at the counter when your food is ready.</p>`}
async function place(){if(busy||!cart.length)return;if(Date.now()-(+localStorage.lastT||0)<30000)return alert('Please wait a few seconds before placing another order.');
busy=true;$('#pl').disabled=true;const id='q'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const o={uid:U.uid,t:Date.now(),table:TB,key:KEY,name:NM.trim().slice(0,40),items:cart.filter(c=>item(c.id)).map(c=>({id:c.id,s:c.s,q:c.q,n:label(item(c.id),c.s)})),total:tot(),status:'new'};
try{await fs.doc('qr/'+id).set(o);localStorage.lastq=id;localStorage.lastT=Date.now();$('#tk').hidden=false;cart=[];gridR();bar();sh(0);track(id)}
catch(e){alert(e.code=='permission-denied'?'This QR code is not valid. Please ask the staff.':'Could not send the order. Check your internet.');$('#pl')&&($('#pl').disabled=false)}busy=false}
