<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1a0d02"><title>Order · Wok &amp; Bite</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--ac:#ff8a00;--ac2:#ff4d2e;--bg:#fff8f1;--card:#fff;--tx:#1d1208;--mut:#7a6a5a;--bd:#f0e2d3;color-scheme:light;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root{--bg:#120c07;--card:#1e150d;--tx:#fff3e6;--mut:#b9a48d;--bd:#33261a;color-scheme:dark}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:110px}
button,input{font:inherit}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#1a0d02,#7c2d00 60%,#ff6a00);color:#fff;text-align:center;padding:calc(28px + env(safe-area-inset-top,0px)) 16px 40px;border-radius:0 0 34px 34px}
.fl i{position:absolute;font-style:normal;opacity:.18;animation:fl 8s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-22px) rotate(10deg)}}
.hin{position:relative}
.logo{font-size:56px;display:inline-block;animation:lg 4s ease-in-out infinite}
@keyframes lg{0%{transform:perspective(200px) rotateY(0)}55%,100%{transform:perspective(200px) rotateY(360deg)}}
h1{margin:4px 0;font-size:34px;letter-spacing:.5px}h1 span{color:#ffb347}
.hero p{margin:0 0 12px;opacity:.85}
.pill{display:inline-block;background:#ffffff24;backdrop-filter:blur(6px);border:1px solid #ffffff44;border-radius:30px;padding:7px 16px;font-weight:600;margin:2px}
button.pill{color:#fff;cursor:pointer}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 12px 4px;margin-top:-18px}
.bar input{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);box-shadow:0 4px 14px #0001}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 16px;border-radius:22px;transition:.2s}
.chips button.on{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;border-color:transparent;transform:scale(1.05)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:8px 12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr);max-width:1000px;margin:auto}}
.c{background:var(--card);border:1px solid var(--bd);border-radius:20px;overflow:hidden;box-shadow:0 8px 20px #0001;display:flex;flex-direction:column;animation:up .5s both;transition:transform .2s}
.c:active{transform:scale(.98)}
@keyframes up{from{opacity:0;transform:translateY(18px) scale(.96)}}
.pic{display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center}
.art span{font-size:54px;filter:drop-shadow(0 8px 8px #0004);animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-5deg) scale(1.08)}}
.cb2{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1;justify-content:space-between}
.cb2>b{font-size:14px;line-height:1.25}
.bs{display:flex;gap:6px}
.bs button{flex:1;border:0;border-radius:12px;padding:9px 4px;font-weight:700;background:#3a2c20;color:#fff;box-shadow:0 3px 0 #1d1208;transition:transform .1s}
.bs button.f{background:linear-gradient(90deg,var(--ac),var(--ac2));box-shadow:0 3px 0 #b33a1b}
.bs button:active{transform:translateY(3px);box-shadow:none}
.n{margin-left:5px;background:#fff;color:var(--ac2);border-radius:8px;padding:0 5px;font-size:12px}.n:empty{display:none}
.msg{padding:40px 20px;text-align:center;color:var(--mut);font-size:17px;grid-column:1/-1}
.cbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;justify-content:space-between;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;border-radius:18px;padding:16px 20px;font-size:16px;box-shadow:0 10px 30px #ff4d2e66;cursor:pointer}
.cbar.pop{animation:pop .35s}@keyframes pop{50%{transform:scale(1.04)}}
.sheet{position:fixed;inset:0;background:#0008;opacity:0;pointer-events:none;transition:.3s;z-index:30}.sheet.open{opacity:1;pointer-events:auto}
.sin{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.9,.3,1)}
.sheet.open .sin{transform:none}
.gr{width:44px;height:5px;border-radius:5px;background:var(--bd);margin:0 auto 10px}
.sin h3{margin:0 0 6px}.r{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--bd)}
.m{color:var(--mut);font-size:13px}.c2{text-align:center}
.q{display:flex;align-items:center;gap:8px}.q button{width:32px;height:32px;border-radius:50%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:18px}
.sin input{width:100%;margin:12px 0;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.t{display:flex;justify-content:space-between;font-size:20px;margin:6px 0}.t b{color:var(--ac)}
.pl{width:100%;border:0;border-radius:16px;padding:15px;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--ac),var(--ac2));box-shadow:0 5px 0 #b33a1b;margin-top:6px}.pl:active{transform:translateY(4px);box-shadow:none}.pl:disabled{opacity:.5}
.trk{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
.tk{text-align:center;max-width:420px;width:100%;animation:up .5s both}
.big{font-size:84px;animation:bob 2s ease-in-out infinite}
.steps{display:flex;justify-content:space-between;margin:22px 0}
.steps div{flex:1;font-size:13px;color:var(--mut)}.steps i{display:flex;width:34px;height:34px;margin:0 auto 6px;border-radius:50%;background:var(--bd);align-items:center;justify-content:center;font-style:normal;font-weight:700;transition:.4s}
.steps .on{color:var(--tx)}.steps .on i{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;transform:scale(1.15)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="hero"><div class="fl" id="fl"></div><div class="hin"><div class="logo">🍜</div><h1>Wok <span>&amp;</span> Bite</h1><p>Good Food · Great Mood</p><span class="pill" id="tb"></span><button class="pill" id="tk" hidden onclick="track(localStorage.lastq)">📦 Track my order</button></div></div>
<div class="bar"><input id="s" placeholder="🔍 Search dishes…" oninput="q=this.value;gridR()"><div class="chips" id="ch"></div></div>
<main class="grid" id="g"></main>
<div class="cbar" id="cb" hidden onclick="sh(1)"></div>
<div class="sheet" id="sheet" onclick="if(event.target==this)sh(0)"><div class="sin" id="si"></div></div>
<div class="trk" id="trk" hidden></div>
<script>
const FB={apiKey:"AIzaSyCFI9yG0NSycWu7ONq9ogyTL7G4Kdgk-6A",authDomain:"wokk-94f97.firebaseapp.com",projectId:"wokk-94f97",appId:"1:983115998097:web:cd1b67242223dc8a013030"};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=new URLSearchParams(location.search),TB=+P.get('table')||0,KEY=P.get('k')||'';
const CATS=['Rolls','Soups','Starters','Combos','Momos','Noodles','Rice'];
const EM=i=>{const n=i.n.toLowerCase();return n.includes('momo')?'🥟':n.includes('roll')?'🌯':n.includes('soup')?'🍲':i.c=='Combos'?'🍱':n.includes('potato')?'🍟':n.includes('noodle')?'🍜':n.includes('rice')?'🍚':n.includes('paneer')?'🧀':'🥘'};
const GR={Rolls:'#f59e0b,#ef4444',Soups:'#f97316,#dc2626',Starters:'#ef4444,#9f1239',Combos:'#8b5cf6,#db2777',Momos:'#fb923c,#e11d48',Noodles:'#f59e0b,#b45309',Rice:'#fbbf24,#ea580c'};
const pic=(i,h)=>i.img?`<div class="pic" style="height:${h}px;background-image:url('${String(i.img).replace(/['"()\s]/g,'')}')"></div>`:`<div class="pic art" style="height:${h}px;background:linear-gradient(135deg,${GR[i.c]||'#f59e0b,#ef4444'})"><span>${EM(i)}</span></div>`;
let M=[],cart=[],cat='Rolls',q='',U=null,NM='',unsub=null,busy=false;
const fmt=n=>'₹'+(+n).toLocaleString('en-IN');
const item=id=>M.find(x=>x.id==id),price=(i,s)=>s=='h'?i.h:i.f,label=(i,s)=>i.n+(i.h!=null?(s=='h'?' (Half)':' (Full)'):'');
const tot=()=>cart.reduce((a,c)=>{const i=item(c.id);return a+(i?price(i,c.s)*c.q:0)},0);
const msg=t=>{$('#g').innerHTML=`<p class="msg">${t}</p>`};
$('#fl').innerHTML=['🍜','🥟','🍚','🌶️','🥢','🔥','🌯'].map((e,i)=>`<i style="left:${(i*15+3)%92}%;top:${(i*23+8)%80}%;animation-delay:${-i*1.1}s;font-size:${28+i%3*12}px">${e}</i>`).join('');
$('#tb').textContent=TB?'🪑 Table '+TB:'🥡 Takeaway';
if(localStorage.lastq)$('#tk').hidden=false;
function chipsR(){$('#ch').innerHTML=CATS.map(c=>`<button class="${cat==c&&!q?'on':''}" onclick="cat='${c}';q='';$('#s').value='';chipsR();gridR()">${c}</button>`).join('')}
function gridR(){const L=M.filter(i=>q?i.n.toLowerCase().includes(q.toLowerCase()):i.c==cat);
$('#g').innerHTML=L.map((i,k)=>`<div class="c" style="animation-delay:${k*40}ms">${pic(i,120)}<div class="cb2"><b>${esc(i.n)}</b><div class="bs">${i.h!=null?`<button data-k="${i.id}h" onclick="add(${i.id},'h')">Half ₹${i.h}<span class="n"></span></button>`:''}<button class="f" data-k="${i.id}f" onclick="add(${i.id},'f')">${i.h!=null?'Full ':'Add '}₹${i.f}<span class="n"></span></button></div></div></div>`).join('')||'<p class="msg">No dishes found</p>';badges()}
function badges(){document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k,c=cart.find(c=>c.id==k.slice(0,-1)&&c.s==k.slice(-1));b.querySelector('.n').textContent=c?'×'+c.q:''})}
function bar(){const n=cart.reduce((a,c)=>a+c.q,0),b=$('#cb');b.hidden=!n;b.innerHTML=`<span>🛒 ${n} item${n>1?'s':''} · <b>${fmt(tot())}</b></span><span>View order ›</span>`;b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');badges();if($('#sheet').classList.contains('open'))sheetR()}
function add(id,s){const c=cart.find(x=>x.id==id&&x.s==s);c?c.q=Math.min(20,c.q+1):cart.push({id,s,q:1});bar()}
function chg(k,n){cart[k].q+=n;if(cart[k].q<1)cart.splice(k,1);bar();if(!cart.length)sh(0)}
function sh(o){$('#sheet').classList.toggle('open',!!o);if(o)sheetR()}
function sheetR(){$('#si').innerHTML=`<div class="gr"></div><h3>Your order · ${TB?'Table '+TB:'Takeaway'}</h3>${cart.map((c,k)=>{const i=item(c.id);return i?`<div class="r"><div style="flex:1"><b>${esc(label(i,c.s))}</b><div class="m">${fmt(price(i,c.s))}</div></div><div class="q"><button onclick="chg(${k},-1)">−</button><b>${c.q}</b><button onclick="chg(${k},1)">+</button></div><b>${fmt(price(i,c.s)*c.q)}</b></div>`:''}).join('')}<input id="nm" placeholder="Your name (optional)" maxlength="40" value="${esc(NM)}" oninput="NM=this.value"><div class="t"><span>Total</span><b>${fmt(tot())}</b></div><button class="pl" id="pl" onclick="place()">Place order</button><p class="m c2">Pay at the counter when your food is ready.</p>`}
async function place(){if(busy||!cart.length)return;if(Date.now()-(+localStorage.lastT||0)<30000)return alert('Please wait a few seconds before placing another order.');
busy=true;$('#pl').disabled=true;const id='q'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const o={uid:U.uid,t:Date.now(),table:TB,key:KEY,name:NM.trim().slice(0,40),items:cart.filter(c=>item(c.id)).map(c=>({id:c.id,s:c.s,q:c.q,n:label(item(c.id),c.s)})),total:tot(),status:'new'};
try{await fs.doc('qr/'+id).set(o);localStorage.lastq=id;localStorage.lastT=Date.now();$('#tk').hidden=false;cart=[];bar();sh(0);track(id)}
catch(e){alert(e.code=='permission-denied'?'This QR code is not valid. Please ask the staff.':'Could not send the order. Check your internet.');$('#pl')&&($('#pl').disabled=false)}busy=false}
function track(id){if(!id)return;if(unsub)unsub();const t=$('#trk');t.hidden=false;t.innerHTML='<div class="tk"><div class="big">⏳</div></div>';
unsub=fs.doc('qr/'+id).onSnapshot(s=>{if(!s.exists){t.hidden=true;return}const o=s.data(),st=o.status,i={new:0,accepted:1,ready:2,done:3,cancelled:0}[st];
const E={new:'📨',accepted:'👨‍🍳',ready:'🎉',done:'🙏',cancelled:'😔'}[st],T={new:'Order sent! Waiting for the restaurant to accept…',accepted:'Your food is being prepared',ready:'Your order is ready! Please pay at the counter.',done:'Thank you! Enjoy your meal.',cancelled:'Sorry, the restaurant could not accept this order. Please ask the staff.'}[st];
t.innerHTML=`<div class="tk"><div class="big">${E}</div><h2>Order #${id.slice(-4).toUpperCase()}</h2><p>${T}</p>${st=='cancelled'?'':`<div class="steps">${['Sent','Preparing','Ready'].map((x,k)=>`<div class="${k<=i?'on':''}"><i>${k+1}</i>${x}</div>`).join('')}</div>`}<p class="m">${o.items.map(x=>esc(x.n)+' ×'+x.q).join(', ')}</p><button class="pl" onclick="$('#trk').hidden=true">Order more</button></div>`},e=>{t.hidden=true})}
firebase.initializeApp(FB);const auth=firebase.auth(),fs=firebase.firestore();
if(!KEY||P.get('table')===null)msg('Please scan the QR code on your table to start ordering 📱');
else{msg('Loading menu…');auth.signInAnonymously().then(c=>{U=c.user;fs.doc('menu/main').onSnapshot(s=>{if(!s.exists){msg('Menu is not ready yet. Please ask the staff.');return}
M=(s.data().menu||[]).filter(i=>i.a!==false);chipsR();gridR();bar()},()=>msg('Could not load the menu. Please try again.'))}).catch(e=>msg(e.code=='auth/operation-not-allowed'?'Setup needed: turn on Anonymous sign-in in Firebase.':'Could not connect. Check your internet.'))}
</script></body></html>
